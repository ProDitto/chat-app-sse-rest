services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      # Override config file settings for containerized environment
      - REDIS_ADDR=redis:6379
      - SERVER_PORT=:8080
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./public/:/usr/share/nginx/html:ro          # Serve frontend
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro       # Use custom config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  redis_data:

