<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE-Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
</head>
<body class="bg-gray-900 text-gray-200 font-sans">

    <!-- Main App Layout -->
    <div id="app" class="flex h-screen hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 flex flex-col">
            <div class="p-4 border-b border-gray-700">
                <h2 class="text-xl font-bold">Active Users</h2>
            </div>
            <div id="user-list" class="flex-1 overflow-y-auto user-list-scrollbar p-2">
                <!-- User items will be injected here -->
            </div>
            <div id="current-user-panel" class="p-4 border-t border-gray-700 bg-gray-900">
                <!-- Current user info will be injected here -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col">
            <header class="bg-gray-800 p-4 border-b border-gray-700">
                <h1 id="chat-header" class="text-xl font-semibold">Welcome to SSE-Chat!</h1>
            </header>
            <div id="message-list" class="flex-1 p-4 overflow-y-auto">
                <!-- Messages will appear here -->
                <div class="text-center text-gray-500">Select a user to start chatting.</div>
            </div>
            <footer class="bg-gray-800 p-4">
                <div class="flex items-center">
                    <input type="text" id="message-input" placeholder="Type a message..." class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500" disabled>
                    <button id="send-button" class="ml-2 px-4 py-2 bg-blue-600 rounded hover:bg-blue-700 disabled:bg-gray-600" disabled>Send</button>
                </div>
            </footer>
        </main>
    </div>

    <!-- Username Modal -->
    <div id="username-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-4 text-center">Join Chat</h2>
            <form id="join-form">
                <div class="mb-4">
                    <label for="username-input" class="block text-sm font-medium text-gray-400 mb-2">Choose a username</label>
                    <input type="text" id="username-input" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" required minlength="3" maxlength="20">
                </div>
                <p id="modal-error" class="text-red-500 text-sm mb-4 h-5"></p>
                <button type="submit" id="join-button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition duration-300">
                    Join
                </button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/lib/dexie.min.js"></script>
    <script src="js/types.js"></script>
    <script src="js/components/avatar.js"></script>
    <script src="js/api.js"></script>
    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
