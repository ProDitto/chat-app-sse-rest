<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSE-Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
</head>
<body class="bg-gray-900 text-gray-200 font-sans">

    <div id="app" class="flex h-screen hidden">
        <!-- User List Sidebar -->
        <aside class="w-64 bg-gray-800 flex flex-col">
            <header class="p-4 border-b border-gray-700">
                <h2 class="text-lg font-bold">Active Users</h2>
            </header>
            <div id="user-list" class="flex-1 p-2 overflow-y-auto user-list-scrollbar">
                <!-- User items will be injected here -->
            </div>
            <div id="current-user-panel" class="p-2 border-t border-gray-700 flex items-center gap-3">
                <!-- Current user info will be injected here -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col">
            <header id="chat-header" class="p-4 border-b border-gray-700 flex items-center gap-4 h-[73px]">
                Select a user to start chatting
            </header>
            <div id="message-list" class="flex-1 p-4 overflow-y-auto">
                <!-- Messages will be appended here -->
            </div>
            <footer class="p-4 border-t border-gray-700">
                <div id="typing-indicator" class="text-sm text-gray-400 h-5 mb-1 hidden"></div>
                <form id="message-form" class="flex gap-4">
                    <input type="text" id="message-input" class="flex-1 bg-gray-700 rounded-full px-4 py-2 focus:outline-none" placeholder="Type a message..." autocomplete="off" disabled>
                    <button type="submit" id="send-button" class="bg-blue-600 text-white rounded-full px-4 py-2 hover:bg-blue-700 disabled:bg-gray-600" disabled>Send</button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Username Modal -->
    <div id="username-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center modal-overlay">
        <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-4 text-center">Join Chat</h2>
            <form id="join-form">
                <input type="text" id="username-input" class="w-full bg-gray-700 rounded px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your username" required minlength="3" maxlength="20">
                <p id="modal-error" class="text-red-400 text-sm h-5 mb-2"></p>
                <button type="submit" id="join-button" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 disabled:bg-gray-600">
                    Join
                </button>
            </form>
        </div>
    </div>

    <script src="/js/lib/dexie.min.js"></script>
    <script type="module" src="/js/types.js"></script>
    <script type="module" src="/js/components/avatar.js"></script>
    <script type="module" src="/js/api.js"></script>
    <script type="module" src="/js/store.js"></script>
    <script type="module" src="/js/sse.js"></script>
    <script type="module" src="/js/ui.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
